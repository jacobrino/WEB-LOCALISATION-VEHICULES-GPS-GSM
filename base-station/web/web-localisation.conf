<VirtualHost *:80>
    ServerName web-localisation.local
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/web-localisation

    <Directory /var/www/web-localisation>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/web-localisation_error.log
    CustomLog ${APACHE_LOG_DIR}/web-localisation_access.log combined
</VirtualHost>
